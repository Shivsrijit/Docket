<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Sleek premium dark backdrop -->
  <rect width="512" height="512" rx="148" fill="#09090B"/>
  <!-- Decorative subtle background glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E79" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="d-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="dot-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAD8E" />
      <stop offset="100%" stop-color="#FF8A5C" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />
  <!-- Sleek premium stylized D -->
  <path d="M 170,140 H 270 C 340,140 390,190 390,256 C 390,322 340,372 270,372 H 170 Z" fill="none" stroke="url(#d-gradient)" stroke-width="48" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- The dot next to D (Docket brand accent dot) -->
  <circle cx="415" cy="372" r="28" fill="url(#dot-gradient)"/>
</svg>